name: collect

# Ten jobs fill the Drive in parallel: Sketchfab models (three lanes), GitHub models, documents (two jobs), other model collections, images
# (buildings and cars first) and the assets job (Brex, Zoom calls, spreadsheets, CAD). Each run starts the next one when it ends, so the
# collection keeps going on its own (the schedule is only a backup). Uploads happen only when repo variable
# LIVE is "true"; CHAIN="off" stops the hand-over. Run state lives in the Actions cache, not on Drive.
# This repository is public: logs print counts only.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "time budget per job (minutes)"
        default: "270"
      dry_run:
        description: "force a dry run (no upload)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

env:
  REMOTE: "pax:Asset Library"
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10  # account limit 20: Financelitics 9, ops-data 1 (2026-11-07)
      matrix:
        include:
          - name: sketchfab
            sources: sketchfab
            cap: models
          - name: sketchfab_mid
            sources: sketchfab_mid
            cap: models
          - name: sketchfab_rev
            sources: sketchfab_rev
            cap: models
          - name: docs_reports
            sources: ntrs,fedreg
            cap: docs
          - name: docs_web
            sources: commoncrawl,gutenberg
            cap: docs
          - name: github
            sources: github_models
            cap: models
          - name: collections
            sources: thingiverse,thingi10k,smithsonian,polyhaven,curated
            cap: models
          - name: images
            sources: focus,images
            focus_parts: commons
            images_parts: commons
          - name: images_web
            sources: focus
            focus_parts: openverse,pixabay,unsplash,pexels
            images_parts: none
          - name: assets
            sources: adobe,figma,zoom_real,sheets,cad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg
        if: matrix.name == 'assets'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core > /dev/null
      - name: Figma re-colouring (node packages)
        if: matrix.name == 'assets'
        run: npm install --no-audit --no-fund -s
      - uses: ./.github/actions/rclone
        with:
          conf: ${{ secrets.RCLONE_CONF }}
          jobs: "12"
      - name: Restore run state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            state-${{ matrix.name }}-
            state-images-
      - name: Seed a new image job from the old images state
        if: startsWith(matrix.name, 'images_')
        run: |
          if [ ! -f "state/${{ matrix.name }}.json" ] && [ -f state/images.json ]; then
            cp state/images.json "state/${{ matrix.name }}.json"; echo "seeded from the images state"
          fi
      - name: Collect
        timeout-minutes: 325
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THINGIVERSE_TOKEN: ${{ secrets.THINGIVERSE_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LIVE: ${{ vars.LIVE == 'true' && inputs.dry_run != true }}
          FOCUS_PARTS: ${{ matrix.focus_parts }}
          IMAGES_PARTS: ${{ matrix.images_parts }}
          # caps (user 2026-11-07): 3D models 301,000 files over 5 jobs, documents 211,000 files over 2 jobs
          CAP_FOLDER: ${{ matrix.cap == 'models' && '01 3D Models' || matrix.cap == 'docs' && '08 Documents' || '' }}
          CAP_TOTAL: ${{ matrix.cap == 'models' && '301000' || matrix.cap == 'docs' && '211000' || '' }}
          CAP_JOBS: ${{ matrix.cap == 'models' && '5' || matrix.cap == 'docs' && '2' || '' }}
        run: |
          budget=$(cat budget.txt)
          flag=$([ "$LIVE" = "true" ] && echo --live || echo "")
          python -m collector --sources "${{ matrix.sources }}" --state state/${{ matrix.name }}.json \
            --budget-gb "$budget" --minutes "${{ inputs.minutes || 270 }}" $flag
      - name: Save run state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}

  next:
    needs: collect
    if: always() && vars.LIVE == 'true' && vars.CHAIN != 'off'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh workflow run collect.yml -R "${{ github.repository }}" --ref main && exit 0
            sleep $(( i * 30 ))
          done
          echo "could not start the next run" >> "$GITHUB_STEP_SUMMARY"; exit 1
