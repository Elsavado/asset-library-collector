name: collect

# Ten jobs fill the Drive in parallel: Sketchfab models (three lanes), GitHub models, documents (two jobs), other model collections, images
# (buildings and cars first) and the assets job (Brex, Zoom calls, spreadsheets, CAD). Each run starts the next one when it ends, so the
# collection keeps going on its own (the schedule is only a backup). Uploads happen only when repo variable
# LIVE is "true"; CHAIN="off" stops the hand-over. Run state lives in the Actions cache, not on Drive.
# This repository is public: logs print counts only.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "time budget per job (minutes)"
        default: "320"
      dry_run:
        description: "force a dry run (no upload)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

env:
  REMOTE: "pax:Asset Library"
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sketchfab
            sources: sketchfab
          - name: sketchfab_mid
            sources: sketchfab_mid
          - name: sketchfab_rev
            sources: sketchfab_rev
          - name: docs_reports
            sources: ntrs,fedreg
          - name: docs_web
            sources: commoncrawl,gutenberg
          - name: github
            sources: github_models
          - name: collections
            sources: thingiverse,thingi10k,smithsonian,polyhaven,curated
          - name: images
            sources: focus,images
            focus_parts: commons
            images_parts: commons
          - name: images_web
            sources: focus
            focus_parts: openverse,pixabay,unsplash,pexels
            images_parts: none
          - name: images_museums
            sources: images
            focus_parts: none
            images_parts: nasa,met
          - name: assets
            sources: adobe,brex_reference,brex_companies,zoom_generated,zoom_real,sheets,cad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg
        if: matrix.name == 'assets'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core > /dev/null
      - uses: ./.github/actions/rclone
        with:
          conf: ${{ secrets.RCLONE_CONF }}
          jobs: "12"
      - name: Restore run state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            state-${{ matrix.name }}-
            state-images-
      - name: Seed a new image job from the old images state
        if: startsWith(matrix.name, 'images_')
        run: |
          if [ ! -f "state/${{ matrix.name }}.json" ] && [ -f state/images.json ]; then
            cp state/images.json "state/${{ matrix.name }}.json"; echo "seeded from the images state"
          fi
      - name: Collect
        timeout-minutes: 325
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THINGIVERSE_TOKEN: ${{ secrets.THINGIVERSE_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LIVE: ${{ vars.LIVE == 'true' && inputs.dry_run != true }}
          FOCUS_PARTS: ${{ matrix.focus_parts }}
          IMAGES_PARTS: ${{ matrix.images_parts }}
        run: |
          budget=$(cat budget.txt)
          flag=$([ "$LIVE" = "true" ] && echo --live || echo "")
          python -m collector --sources "${{ matrix.sources }}" --state state/${{ matrix.name }}.json \
            --budget-gb "$budget" --minutes "${{ inputs.minutes || 300 }}" $flag
      - name: Save run state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}

  next:
    needs: collect
    if: always() && vars.LIVE == 'true' && vars.CHAIN != 'off'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml -R "${{ github.repository }}"
